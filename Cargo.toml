[workspace]
resolver = "3"
members = ["browser"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
norte = { git = "https://github.com/JeanVydes/Norte.git", branch = "dev" }
norte-tools = { git = "https://github.com/JeanVydes/Norte.git", branch = "dev" }
norte-code-plugin-host = { git = "https://github.com/JeanVydes/NorteCode.git", branch = "dev" }
serde_json = "1"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
