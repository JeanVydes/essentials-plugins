[workspace]
resolver = "3"
members = ["browser"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
norte = { git = "https://github.com/JeanVydes/Norte.git", branch = "dev" }
norte-tools = { git = "https://github.com/JeanVydes/Norte.git", branch = "dev" }
norte-code-plugin-host = { git = "https://github.com/JeanVydes/NorteCode.git", branch = "dev" }
schemars = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
